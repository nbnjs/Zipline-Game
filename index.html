<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,mix=(A,B,t)=>A.map((v,i)=>Math.round(lerp(v,B[i],t))),rgb=a=>'rgb('+a+')';
const PAL=[[[61,155,224],[215,240,255]],[[100,60,150],[255,160,105]],[[5,10,34],[28,44,98]]];
function sky(t){const k=t*2,i=Math.min(1,Math.floor(k)),f=k-i;return[mix(PAL[i][0],PAL[i+1][0],f),mix(PAL[i][1],PAL[i+1][1],f)]}
let W,H,GY,hw0,ds,stars=[],trees=[],clouds=[],bldA=[],bldB=[];
function rs(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  GY=H*.84;hw0=clamp(W*.22,90,190);ds=clamp(W*.13,44,84);
  let seed=7;const r=()=>(seed=seed*16807%2147483647)/2147483647;
  const mk=(a,b)=>{const o=[];let x=-10;while(x<W){const w=30+r()*50;o.push({x,w,h:H*(a+r()*b),c:Math.floor(r()*3),k:Math.floor(r()*9)});x+=w+r()*6}return o};
  bldA=mk(.2,.25);bldB=mk(.1,.22);
  stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*H*.6,s:Math.random()*1.6+.4,p:Math.random()*6}));
  trees=[...Array(Math.ceil(W/55))].map((_,i)=>({x:i*55+Math.random()*30,s:.6+Math.random()*.6}));
  clouds=[0,1,2,3,4].map(i=>({x:Math.random()*W,y:H*(.08+i*.05),s:.7+Math.random()*.7}));
}
addEventListener('resize',rs);rs();
// ---- sound
let AC=null,mute=false;
function tone(f,d,ty,v,f2,s){if(mute||!AC)return;const t=AC.currentTime+(s||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
let NB=null,rainG=null,rv=0;
function noise(d,v,ty,f0,f1,st0){if(mute||!AC||!NB)return;const t=AC.currentTime+(st0||0),o=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();o.buffer=NB;f.type=ty;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const SND={drop(){tone(700,.35,'triangle',.12,180)},
hit(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,0,i*.09));noise(.9,.07,'bandpass',1800,2800,.15)},
miss(){tone(160,.5,'sawtooth',.14,40);tone(90,.4,'square',.1,40,.05);noise(.35,.3,'lowpass',900,90);[0,.25].forEach(t=>tone(100,.2,'sine',.35,45,t));tone(300,.9,'triangle',.1,70,.3)},
good(){tone(660,.15,'sine',.15);tone(880,.3,'sine',.15,0,.12)},bad(){tone(220,.4,'square',.1,110)},
thunder(){noise(.2,.4,'highpass',2500,600);tone(60,2,'sawtooth',.1,22,.04);noise(2.6,.55,'lowpass',600,50,.05);noise(2,.35,'lowpass',300,40,.7);noise(1.6,.25,'lowpass',200,35,1.5)},
end(){[392,523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.14,0,i*.15))}};
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();
if(AC&&!NB){const n=AC.sampleRate*2,bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NB=bf;const sr=AC.createBufferSource(),f=AC.createBiquadFilter(),f2=AC.createBiquadFilter();sr.buffer=bf;sr.loop=true;f.type='highpass';f.frequency.value=1200;f2.type='lowpass';f2.frequency.value=7000;rainG=AC.createGain();rainG.gain.value=0;sr.connect(f);f.connect(f2);f2.connect(rainG);rainG.connect(AC.destination);sr.start()}}
$('mute').addEventListener('pointerdown',e=>{e.stopPropagation();mute=!mute;$('mute').textContent=mute?'🔇':'🔊'});

const Q=[
["What does Zipline do?","Delivers medical supplies and products by autonomous drone",["Builds electric cars","Makes delivery trucks"]],
["When was Zipline founded?","2014",["2010","2019"]],
["Where was Zipline founded?","California, USA",["Rwanda","Japan"]],
["How many co-founders does Zipline have?","Four",["Two","Seven"]],
["Why was Zipline created?","To get medical supplies to clinics faster",["To film from the sky","To replace airplanes"]],
["Where did the first medical deliveries start?","Rwanda",["Ghana","Kenya"]],
["When did those deliveries begin?","October 2016",["April 2019","January 2026"]],
["Which medical products does Zipline deliver?","Blood, vaccines and medicines",["Furniture and tools","Only food"]],
["What does \"autonomous\" mean?","The drone flies without a person controlling every move",["It is steered by joystick all the time","It runs on solar power only"]],
["What are the five steps of a delivery?","Order, pack, fly, drop, recharge",["Buy, ship, land, sell, repair","Pack, sort, drive, park, sleep"]],

["Why is Platform 2 useful for home deliveries?","It can place packages on a precise spot",["It carries one ton","It is faster than a plane"]],
["What does Zipline deliver in the United States?","Food, medical supplies and retail products",["Only blood","Only passengers"]],
["Which of these is a Zipline partner?","Walmart",["Netflix","Ikea"]],
["What are Zipline's main challenges?","Weather, operating costs and regulations",["Too many roads","Lack of customers in cities"]],
["Does Zipline need permission to fly?","Yes, approval and aviation safety rules",["No, drones are unregulated","Only in Africa"]],
["Why was Zipline chosen for this presentation?","It connects electronics and software with a practical use",["It is the cheapest company","It makes video games"]]
];
const ROUNDS=20,MISS_MIN=11; // MISS_MIN = nb mini de largages ratés (= questions) imposés ; 15/28 à l'origine, remis à l'échelle pour 20
let lost=0,lock=false,st='intro',paused=true,round,hits,okQ,qs,hx,hc,hr,hs,hph,wph,wd,dr,pk,parts,texts,trail,score,streak,best,shake=0,glow=0,flash=0,rain=[],hw,hh,T=0,rt,sp0,nd=0,tm;
let amb=[],ambT=3,sirT=0,sirH=false,bolt=null,drops=[],cheer=0,lostFx=0,stf=[{x:0,o:-.28,k:0,c:'#26a69a'},{x:0,o:.28,k:2,c:'#ef5350'}];
const lv=()=>{const k=round||0;return k<2?k*1.6:3.2+(k-2)*7.8/(ROUNDS-3)},prog=()=>clamp((round||0)/(ROUNDS-1),0,1),shuffle=a=>a.sort(()=>Math.random()-.5),mult=()=>1+.25*lv();
const say=t=>$('msg').textContent=t;
function hud(){$('s1').textContent='Drop '+Math.min(round+1,ROUNDS)+'/'+ROUNDS+'  ·  ❤️'+hits+' 💔'+lost;$('s2').textContent='⭐ '+score}
function start(){amb=[];drops=[];bolt=null;lostFx=cheer=0;lost=0;round=0;hits=0;okQ=0;score=0;streak=0;best=0;qs=shuffle(Q.slice());newRound()}
const HINTS={2:'⚠ The hospital is moving! 🌧 Rain incoming',4:'⚠ Decoy clinics! Only the red HOSPITAL counts',9:'🌫 Fog + turbulence',13:'🌙 Night falls — 2 decoys',16:'⛈ Storm! Hold on...',[ROUNDS-1]:'☠ FINAL DROP — good luck'};
function newRound(){
  const r=lv();hw=hw0*Math.max(.5,1-.045*r);hw*=clamp(1-.07*(hits-round*.45),.6,1);lock=MISS_MIN-(round-hits)>=ROUNDS-round;if(lock)hw=hw0*.12;hh=hw*.72;
  hc=W*.55;hr=clamp(W*.026*Math.max(0,r-1),0,W*.27);hs=.5+.13*r;hph=Math.random()*6;wph=Math.random()*6;
  sp0=W*(.2+.025*r);nd=r<4?0:r<8?1:2;
  dr={x:-ds,y:H*.2,dir:1,v:0};pk=null;parts=[];texts=[];trail=[];glow=0;rt=10;
  rain=[...Array(r>=3?Math.floor(Math.min(260,35*r)):0)].map(()=>({x:Math.random()*W,y:Math.random()*H,v:H*(.9+Math.random()*.5)}));
  st='fly';$('msg').style.color='';const hm=lock?'⛈ Mega-storm! Tiny landing zone!':HINTS[round];say(hm||'');if(hm)setTimeout(()=>{if(st==='fly')say('')},2600);
  hud();$('help').textContent='TAP to drop the blood package onto the HOSPITAL roof!';$('help').style.opacity=1;
}
function release(){
  initAudio();if(paused||st!=='fly'||dr.x<0||dr.x>W)return;
  pk={x:dr.x,y:dr.y+ds*.75,vx:dr.v,vy:0,s:ds*.42};st='drop';$('help').style.opacity=0;SND.drop();
}
cv.addEventListener('pointerdown',release);
addEventListener('keydown',e=>{if(e.code==='Space')release()});
function burst(x,y,cols,n,spd){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(spd||300),vy:-Math.random()*(spd||300),t:1,c:cols[i%cols.length],r:2+Math.random()*3})}
function pop(x,y,t,c){texts.push({x,y,t:1,txt:t,c:c||'#fff'})}
function result(ok,why){
  st='wait';
  if(ok){
    const off=Math.abs(pk.x-hx)/(hw/2),pts=Math.round((100+50*(1-clamp(off,0,1))+25*streak+rt*4)*mult());
    streak++;best=Math.max(best,streak);hits++;score+=pts;glow=1;cheer=1;
    burst(pk.x,pk.y,['#e53935','#fff','#ffeb3b','#4fc3f7'],80,550);
    say(off<.25?'PERFECT! 🏥':'DELIVERED! 🏥'+(streak>1?'  x'+streak:''));pop(pk.x,pk.y-30,'+'+pts,'#ffeb3b');
    SND.hit();hud();tm=setTimeout(next,1500);
  }else{
    streak=0;lost++;shake=26;lostFx=1;if(pk)burst(pk.x,pk.y,['#8d6e63','#a1887f','#d7ccc8'],24,260);
    say(why+' 💔 A life lost... thanks to you!');$('msg').style.color='#ff5252';SND.miss();hud();const h=$('s1');h.classList.remove('hurt');void h.offsetWidth;h.classList.add('hurt');tm=setTimeout(ask,1100);
  }
}
function next(){round++;round>=ROUNDS?endGame():newRound()}
function ask(){
  const q=qs.pop()||Q[0],opts=shuffle([q[1],...q[2]].map(t=>({t,ok:t===q[1]}))),box=$('box');
  box.innerHTML='<div class="bh">💔</div><h3>🩸 MISSED! LIFE LOST #'+lost+' · ANSWER TO GAIN POINTS · DROP '+(round+1)+'/'+ROUNDS+'</h3><h2></h2>';
  box.querySelector('h2').textContent=q[0];
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>{const all=[...box.querySelectorAll('button')];all.forEach(x=>x.disabled=true);
      if(o.ok){b.classList.add('ok');okQ++;score+=Math.round(80*mult());SND.good()}
      else{b.classList.add('ko');all.find(x=>x.textContent===q[1]).classList.add('ok');SND.bad()}
      setTimeout(()=>{$('modal').style.display='none';next()},1300)};
    box.appendChild(b)});
  $('modal').style.display='flex';
}
function endGame(){
  st='end';SND.end();const box=$('box');
  const r=okQ>=MISS_MIN?'🏆 Zipline expert':okQ>=Math.round(MISS_MIN*2/3)?'🥈 Good listener':'🥉 Time to rewatch the talk';
  box.innerHTML='<h3>🏁 MISSION COMPLETE</h3><h2>Final score: '+score+'</h2><p>'+r+'</p><p>🏥 Deliveries: '+hits+'/'+ROUNDS+'</p><p>✅ Correct answers: '+okQ+'</p><p>💔 Lives lost: '+lost+'</p><p>🔥 Best streak: '+best+'</p>';
  const b=document.createElement('button');b.className='opt';b.textContent='Play again';
  b.onclick=()=>{$('modal').style.display='none';start()};box.appendChild(b);$('modal').style.display='flex';
}
function intro(){
  const box=$('box');box.innerHTML='<h3>🚁 ZIPLINE MISSION</h3><h2>Deliver the blood to the hospital</h2><p>'+ROUNDS+' drops. Wind, a moving target, decoy clinics, fog and storms get worse each time.</p><p>Tap (or Space) to release the package. Miss → answer a question to earn points.</p>';
  const b=document.createElement('button');b.className='opt';b.textContent='Start mission';
  b.onclick=()=>{initAudio();$('modal').style.display='none';paused=false;start()};box.appendChild(b);
}
const decoyX=i=>W*(.5+.42*Math.sin(T*(.3+.1*i)+i*3+1));
function update(dt){
  T+=dt;const r=lv();
  wd=(lock?1.8:1)*W*.012*r*(Math.sin(T*.9+wph)+.5*Math.sin(T*2.3));
  hx=hc+Math.sin(T*hs+hph)*hr;
  if(st==='fly'){
    const cs=sp0*(r>=3?1+.35*Math.sin(T*1.7):1);dr.v=dr.dir*cs;dr.x+=dr.v*dt;
    if(dr.x>W+ds*.6)dr.dir=-1;if(dr.x<-ds*.6)dr.dir=1;
    dr.y=H*.2+Math.sin(T*1.3)*H*.01*r;
    if(Math.random()<.6)trail.push({x:dr.x-dr.dir*ds,y:dr.y,t:1});
    rt-=dt;$('bi').style.width=clamp(rt/10,0,1)*100+'%';
    if(rt<=0){result(false,'Too slow!')}
  }
  if(st==='drop'){
    pk.vy=Math.min(pk.vy+H*.9*dt,H*.32);pk.vx+=wd*dt;pk.vx*=Math.exp(-dt);
    if(r>=6&&Math.random()<dt*1.2)pk.vx+=(Math.random()-.5)*W*.12;
    pk.x+=pk.vx*dt;pk.y+=pk.vy*dt;
    const roof=GY-hh-pk.s*.5;
    if(pk.y>=roof&&Math.abs(pk.x-hx)<hw/2+pk.s*.4){pk.y=roof;result(true)}
    else if(pk.y>=GY-hh*.9-pk.s*.5){
      for(let i=0;i<nd;i++)if(Math.abs(pk.x-decoyX(i))<hw*.45+pk.s*.4&&pk.y>=roof){pk.y=roof;result(false,'That was a decoy clinic!');return}
      if(pk.y>=GY-pk.s*.5){pk.y=GY-pk.s*.5;result(false,pk.x<hx?'Too early!':'Too late!')}
    }
  }
  clouds.forEach(c=>{c.x+=8*c.s*dt;if(c.x>W+80)c.x=-80});
  parts.forEach(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt*.8});parts=parts.filter(p=>p.t>0);
  texts.forEach(t=>{t.y-=40*dt;t.t-=dt*.6});texts=texts.filter(t=>t.t>0);
  trail.forEach(t=>{t.t-=dt*1.2});trail=trail.filter(t=>t.t>0);
  rain.forEach(q=>{q.y+=q.v*dt;q.x+=wd*.8*dt;if(q.y>H){q.y=-10;q.x=Math.random()*W}});
  shake=Math.max(0,shake-40*dt);glow=Math.max(0,glow-dt*.5);
  if(r>=7&&flash<=0&&Math.random()<.004){flash=1;SND.thunder();mkBolt()}flash=Math.max(0,flash-dt*2.5);
  cheer=Math.max(0,cheer-dt*.6);lostFx=Math.max(0,lostFx-dt*.85);
  stf.forEach(p=>{const tg=(st==='drop'&&pk)?clamp(pk.x+p.o*hw*.5,hx-hw*.75,hx+hw*.75):hx+p.o*hw;p.x=p.x?lerp(p.x,tg,Math.min(1,dt*5)):tg});
  ambT-=dt;if(ambT<=0){ambT=7+Math.random()*9;const d=Math.random()<.5?1:-1;amb.push({x:d>0?-150:W+150,dir:d,v:W*(.14+Math.random()*.1),y:GY+(H-GY)*(d>0?.7:.56)})}
  amb.forEach(a=>a.x+=a.dir*a.v*dt);amb=amb.filter(a=>a.x>-W*.3&&a.x<W*1.3);
  sirT-=dt;if(amb.length&&sirT<=0){sirT=.4;sirH=!sirH;const vv=Math.max(...amb.map(a=>1-Math.abs(a.x-W/2)/(W*.75)))*.05;if(vv>.004)tone(sirH?960:720,.38,'sine',vv)}
  if(rain.length&&Math.random()<dt*rain.length*.035&&drops.length<70){drops.push({x:Math.random()*W,y:Math.random()*H*.9,r:3+Math.random()*7,vy:0,tl:0,life:1});tone(2200+Math.random()*900,.04,'sine',.015)}
  drops.forEach(d=>{if(Math.random()<dt*(d.r>6?1.6:.6))d.vy=H*(.06+Math.random()*.14);d.vy*=Math.exp(-dt*1.8);d.y+=d.vy*dt;d.tl=Math.min(70,d.tl+d.vy*dt*.9)*(d.vy<8?Math.exp(-dt*2):1);d.life-=dt*.12});drops=drops.filter(d=>d.life>0&&d.y<H+20);
  const rt2=mute?0:Math.min(.15,rain.length/260*.15);rv+=(rt2-rv)*Math.min(1,dt*2);if(rainG)rainG.gain.value=rv;
}
function glowAt(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalCompositeOperation='source-over'}
function cross(x,y,s,c){ctx.fillStyle=c;ctx.fillRect(x-s*.17,y-s*.5,s*.34,s);ctx.fillRect(x-s*.5,y-s*.17,s,s*.34)}
function box(x,y,s){const g=ctx.createLinearGradient(x-s/2,y-s/2,x+s/2,y+s/2);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd8dc');ctx.fillStyle=g;ctx.fillRect(x-s/2,y-s/2,s,s);ctx.strokeStyle='#d32f2f';ctx.lineWidth=2.5;ctx.strokeRect(x-s/2,y-s/2,s,s);cross(x,y,s*.6,'#d32f2f')}
function chute(x,y,s,now){
